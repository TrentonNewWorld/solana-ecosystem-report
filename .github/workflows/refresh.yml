name: Refresh Solana report

# The automation strategy in one file: a cron refreshes the data, the pipeline
# regenerates all three output formats, the new snapshot is committed back to the
# repo (so history.jsonl grows into a real time series), and the dashboard is
# published to GitHub Pages. Nothing else has to happen for the report to stay
# current — there is no server, no database and no API key to rotate.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; drop to "0 * * * *" for hourly
  workflow_dispatch:         # manual refresh button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # commit the refreshed snapshot back
  pages: write
  id-token: write

concurrency:
  group: solreport-refresh
  cancel-in-progress: false   # never interrupt a run mid-commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No `pip install` step: the pipeline is standard library only.

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Generate report
        run: python -m solreport --out output --data data

      - name: Upload outputs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-report-${{ github.run_number }}
          path: output/

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "solreport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.jsonl output/report.md output/report.json
          git diff --staged --quiet || git commit -m "chore: refresh snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
