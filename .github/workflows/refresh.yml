name: Refresh Solana report

# The automation strategy in one file: a cron refreshes the data, the pipeline
# regenerates all three output formats into docs/, and the new snapshot is
# committed back to the repo. GitHub Pages serves docs/ off main, so the commit
# IS the deploy — no Pages artifact, no id-token, no server, no database and no
# API key to rotate. history.jsonl grows one line per run into a real time series.

on:
  schedule:
    # Every 6 hours, deliberately at :41 past an ODD hour rather than "0 */6 * * *".
    # GitHub load-sheds scheduled runs and its own docs warn they "can be delayed
    # during periods of high load" — the top of the hour, and midnight UTC most of
    # all, are the worst slots, and dropped runs are simply never retried. The
    # original on-the-hour schedule registered as active but fired zero times in
    # two consecutive windows. An off-peak minute is the documented mitigation.
    - cron: "41 1,7,13,19 * * *"
  workflow_dispatch:         # manual refresh button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # commit the refreshed snapshot back

concurrency:
  group: solreport-refresh
  cancel-in-progress: false   # never interrupt a run mid-commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No `pip install` step: the pipeline is standard library only.

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Generate report
        run: python -m solreport --out docs --data data

      - name: Upload outputs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solana-report-${{ github.run_number }}
          path: docs/

      - name: Commit refreshed snapshot (this is the Pages deploy)
        run: |
          set -u
          git config user.name  "solreport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A concurrent commit (a manual push, or an overlapping run) rejects the
          # push. Integrate and regenerate rather than failing the refresh:
          # history.jsonl union-merges via .gitattributes, and docs/ is rebuilt
          # from the merged history so it always matches what was committed.
          for attempt in 1 2 3; do
            git add data/history.jsonl docs/
            if git diff --staged --quiet; then
              echo "No change in this refresh - nothing to deploy."
              exit 0
            fi
            git commit -m "chore: refresh snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "Deployed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - integrating remote and regenerating."
            git fetch origin main
            git merge -X ours --no-edit origin/main
            python -m solreport --out docs --data data
          done
          echo "::error::Could not push the refreshed snapshot after 3 attempts."
          exit 1
